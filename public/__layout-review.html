<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layout verification</title><style>body{margin:0;background:#070809;color:#eee;font:14px system-ui}nav{position:sticky;top:0;z-index:2;display:flex;gap:12px;padding:12px;background:#23272a}button,select{padding:8px;background:#111315;color:#fff;border:1px solid #555;border-radius:4px}main{display:flex;justify-content:center;padding:14px}iframe{border:1px solid #777;background:#111315;width:390px;height:844px}output{align-self:center;margin-left:auto}</style></head><body><nav><button onclick="size(390)">Phone 390 px</button><button onclick="size(320)">Small phone 320 px</button><button onclick="size(768)">Tablet 768 px</button><select aria-label="Page" onchange="document.querySelector('iframe').src=this.value"><option value="/">Home</option><option value="/archive">Playground</option><option value="/projects/lumo">Lumo</option><option value="/cv">Resume</option></select><output id="metrics"></output></nav><main><iframe src="/" title="Responsive preview"></iframe></main><script>function size(w){document.querySelector('iframe').style.width=w+'px'}setInterval(()=>{const f=document.querySelector('iframe');try{const d=f.contentDocument;document.getElementById('metrics').textContent=d.documentElement.clientWidth+'px / content '+d.documentElement.scrollWidth+'px / '+getComputedStyle(d.body).backgroundColor}catch{}},800)</script></body></html>
